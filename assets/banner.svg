<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1f2d52; stroke-width: 1; opacity: 0.35; }
    .route-path {
      stroke: #38ef7d;
      stroke-width: 3;
      stroke-dasharray: 8 8;
      fill: none;
      animation: dashMove 30s linear infinite;
    }
    .secondary-path {
      stroke: #00f2fe;
      stroke-width: 2.5;
      stroke-dasharray: 6 6;
      fill: none;
      opacity: 0.7;
      animation: dashMoveRev 25s linear infinite;
    }
    .orbit-node {
      animation: float 4s ease-in-out infinite alternate;
    }
    .pulse-circle {
      animation: pulseRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .pill-card {
      fill: #131d3b;
      stroke: #2a3b68;
      stroke-width: 1.5;
      rx: 16;
    }

    @keyframes dashMove {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dashMoveRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 400; }
    }
    @keyframes pulseRing {
      0% { r: 6; opacity: 1; }
      50% { r: 16; opacity: 0.3; }
      100% { r: 24; opacity: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Matrix Grid Background -->
  <g class="grid-line">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />

    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Dynamic / Animated Background Routing Curves (Behind Text) -->
  <g opacity="0.6">
    <path class="route-path" d="M 50,340 C 250,380 400,280 600,320 C 800,360 950,260 1150,300" />
    <path class="secondary-path" d="M 80,80 C 280,40 450,150 720,100 C 920,60 1020,160 1140,110" />
  </g>

  <!-- Glowing Fleet Waypoint Markers in Background -->
  <g transform="translate(180, 95)">
    <circle class="pulse-circle" cx="0" cy="0" r="10" fill="#00f2fe" opacity="0.4" />
    <circle cx="0" cy="0" r="5" fill="#38ef7d" filter="url(#glow)" />
  </g>
  <g transform="translate(1040, 130)">
    <circle class="pulse-circle" cx="0" cy="0" r="10" fill="#38ef7d" opacity="0.4" />
    <circle cx="0" cy="0" r="5" fill="#00f2fe" filter="url(#glow)" />
  </g>
  <g transform="translate(980, 275)">
    <circle class="pulse-circle" cx="0" cy="0" r="12" fill="#ff7675" opacity="0.4" />
    <circle cx="0" cy="0" r="6" fill="#ff7675" filter="url(#glow)" />
  </g>

  <!-- Foreground Title and Branding Content (Guaranteed Foreground Visibility) -->
  <g id="foreground-content">
    <!-- Top Ecosystem Category Pill -->
    <g transform="translate(600, 75)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#132247" stroke="#38ef7d" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38ef7d" letter-spacing="2">
        CURATED ECOSYSTEM DIRECTORY
      </text>
    </g>

    <!-- Main Repository Title -->
    <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Fleet &amp; Transportation
    </text>

    <!-- Subtitle / Mission Tagline -->
    <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="url(#accentGrad)" letter-spacing="0.5">
      Telematics • Self-Hosted GPS Tracking • VRP Route Optimization • Fleet ERP
    </text>

    <!-- Explanatory Subtitle -->
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Production SaaS Benchmarks &amp; Community-Driven Open-Source Infrastructure
    </text>

    <!-- Interactive Pill Cards Row (Features) -->
    <g transform="translate(600, 315)">
      <!-- Pill 1: GPS & Telematics -->
      <g transform="translate(-390, 0)">
        <rect x="0" y="0" width="180" height="42" class="pill-card" />
        <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0">
          🛰️ GPS Telematics
        </text>
      </g>

      <!-- Pill 2: Route Optimization -->
      <g transform="translate(-195, 0)">
        <rect x="0" y="0" width="180" height="42" class="pill-card" />
        <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0">
          ⚡ Route Optimization
        </text>
      </g>

      <!-- Pill 3: Fleet Lifecycle ERP -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="185" height="42" class="pill-card" />
        <text x="92" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0">
          🚚 Fleet Operations
        </text>
      </g>

      <!-- Pill 4: Open Source & SaaS -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="195" height="42" class="pill-card" />
        <text x="97" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0">
          📊 Transparent Pricing
        </text>
      </g>
    </g>
  </g>
</svg>
